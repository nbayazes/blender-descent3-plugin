# Blender extension manifest. This is the canonical source of the add-on's
# version: install.ps1 and install.sh both read it from here, and
# tests/test_manifest.py fails if bl_info in __init__.py drifts from it.
#
# bl_info still carries a literal copy because Blender has no choice but to
# ast-parse it: addon_utils.modules() reads bl_info out of the file text with
# literal_eval WITHOUT importing the module, so computing the version at import
# time makes the add-on vanish from Edit > Preferences > Add-ons entirely. The
# test is what keeps the two honest.
#
# Validate with:  blender --command extension validate descent3_plugin
schema_version = "1.0.0"

id = "descent3_plugin"
version = "1.0.0"
name = "Descent 3 POF/OOF Importer/Exporter"
tagline = "Import and export Descent 3 3D model files (POF/OOF format)"
maintainer = "Descent Community"
type = "add-on"

tags = ["Import-Export"]

blender_version_min = "4.2.0"

# GPL-3.0-or-later because reference/ redistributes the Descent 3 engine
# sources, which are GPL-3.0-or-later (c) 2024 Parallax Software.
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
files = "Import and export Descent 3 POF/OOF model files"
